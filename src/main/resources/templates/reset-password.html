<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card shadow-sm" style="width:400px;"><div class="card-body p-4">
        <h4 class="text-center mb-4">Reset Password</h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <input type="password" name="newPassword" class="form-control mb-3" placeholder="New password" required minlength="6">
            <button type="submit" class="btn btn-success w-100">Reset Password</button>
        </form>
    </div></div></div>
</body></html>
