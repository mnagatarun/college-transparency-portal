<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal — College Transparency Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body>

<nav class="navbar-institutional">
    <div>
        <p class="brand">Admin Portal<small th:text="${adminName}"></small></p>
    </div>
    <a th:href="@{/logout}" class="btn-ghost">Logout</a>
</nav>

<div class="page-wrap">

    <div class="card-doc">
        <h5>Create Faculty Account</h5>
        <form th:action="@{/admin/faculty/create}" method="post" class="row g-2">
            <div class="col-md-3"><input type="text" name="name" class="form-control" placeholder="Full name" required></div>
            <div class="col-md-2"><input type="text" name="facultyId" class="form-control" placeholder="Faculty ID" required></div>
            <div class="col-md-2"><input type="text" name="department" class="form-control" placeholder="Department" required></div>
            <div class="col-md-2"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
            <div class="col-md-2"><input type="password" name="password" class="form-control" placeholder="Password" required></div>
            <div class="col-md-1"><button type="submit" class="btn-brass w-100">Add</button></div>
        </form>
    </div>

    <div class="card-doc">
        <h5>All Users</h5>
        <table class="doc-table">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="u : ${allUsers}">
                <td th:text="${u.name}"></td>
                <td class="mono" th:text="${u.email}"></td>
                <td><span class="stamp stamp-pending" th:text="${u.role}"></span></td>
                <td>
                    <span class="stamp" th:text="${u.enabled} ? 'Active' : 'Disabled'"
                          th:classappend="${u.enabled} ? 'stamp-active' : 'stamp-disabled'"></span>
                </td>
                <td>
                    <form th:action="@{'/admin/toggle/' + ${u.id}}" method="post" style="display:inline;">
                        <button type="submit" class="btn-ghost" style="border-color:var(--border); color:var(--text-muted); padding:0.25rem 0.7rem; font-size:0.78rem;">
                            <span th:text="${u.enabled} ? 'Disable' : 'Enable'"></span>
                        </button>
                    </form>
                    <form th:action="@{'/admin/reset-password/' + ${u.id}}" method="post" style="display:inline;">
                        <input type="password" name="newPassword" placeholder="New password" style="width:130px;" class="form-control d-inline" required>
                        <button type="submit" class="btn-primary-inst" style="padding:0.3rem 0.8rem; font-size:0.78rem;">Reset</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card-doc">
        <h5>Global Marks Audit Log</h5>
        <table class="doc-table">
            <thead><tr><th>Marks ID</th><th>Old</th><th>New</th><th>Changed By</th><th>Changed At</th></tr></thead>
            <tbody>
            <tr th:each="log : ${auditLogs}">
                <td class="mono" th:text="${log.marksId}"></td>
                <td class="mono" th:text="${log.oldValue}"></td>
                <td class="mono" th:text="${log.newValue}"></td>
                <td th:text="${log.changedBy}"></td>
                <td class="mono" th:text="${log.changedAt}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(auditLogs)}"><td colspan="5" class="text-muted-inst">No audit entries yet.</td></tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
