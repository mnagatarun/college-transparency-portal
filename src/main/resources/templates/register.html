<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register — College Transparency Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card" style="width:460px;">
        <h2 class="brand" style="margin-bottom:0.2rem;">Student registration</h2>
        <p class="text-muted-inst" style="margin-bottom:1.5rem;">Create your portal account</p>

        <div th:if="${error}" class="alert-inst alert-danger-inst" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">Roll number</label>
                    <input type="text" name="rollNumber" class="form-control" required>
                </div>
                <div class="col-6">
                    <label class="form-label">Department</label>
                    <input type="text" name="department" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn-primary-inst w-100" style="margin-top:0.5rem;">Create account</button>
        </form>

        <p class="text-center mt-3" style="font-size:0.85rem;">
            Already registered? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>
</div>

</body>
</html>
