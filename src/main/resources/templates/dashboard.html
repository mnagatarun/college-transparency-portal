<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — College Transparency Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body>

<nav class="navbar-institutional">
    <div>
        <p class="brand">Student Portal<small>College Transparency Portal</small></p>
    </div>
    <a th:href="@{/logout}" class="btn-ghost">Logout</a>
</nav>

<div class="page-wrap">

    <h3 style="margin-bottom:1.5rem;">Welcome, <span th:text="${studentName}"></span></h3>

    <div class="row mb-3">
        <div class="col-md-4 mb-3">
            <div class="metric-card">
                <div class="label">Attendance</div>
                <div class="value" th:text="${#numbers.formatDecimal(attendancePercentage, 1, 2)} + '%'">0%</div>
            </div>
        </div>

        <div class="col-md-8 mb-3">
            <div class="card-doc" style="height:100%;">
                <h5>Recent Marks</h5>
                <table class="doc-table">
                    <thead><tr><th>Subject</th><th>Exam</th><th>Marks</th></tr></thead>
                    <tbody>
                    <tr th:each="mark : ${marksList}">
                        <td th:text="${mark.subject}"></td>
                        <td class="mono" th:text="${mark.examType}"></td>
                        <td class="mono" th:text="${mark.marksObtained} + ' / ' + ${mark.maxMarks}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(marksList)}">
                        <td colspan="3" class="text-muted-inst">No marks recorded yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-5 mb-3">
            <div class="card-doc">
                <h5>Request Outpass</h5>
                <div th:if="${outpassError}" class="alert-inst alert-danger-inst" th:text="${outpassError}"></div>
                <form th:action="@{/outpass/request}" method="post">
                    <div class="mb-2">
                        <label class="form-label">Reason</label>
                        <input type="text" name="reason" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Out time</label>
                        <input type="datetime-local" name="outTime" class="form-control" required>
                    </div>
                    <button type="submit" class="btn-brass w-100">Submit Request</button>
                </form>
            </div>
        </div>

        <div class="col-md-7 mb-3">
            <div class="card-doc">
                <h5>Outpass History</h5>
                <table class="doc-table">
                    <thead><tr><th>Reason</th><th>Out Time</th><th>Status</th></tr></thead>
                    <tbody>
                    <tr th:each="outpass : ${outpassList}">
                        <td th:text="${outpass.reason}"></td>
                        <td class="mono" th:text="${outpass.outTime}"></td>
                        <td>
                            <span class="stamp"
                                  th:text="${outpass.status}"
                                  th:classappend="${outpass.status == 'APPROVED'} ? 'stamp-approved' : (${outpass.status == 'REJECTED'} ? 'stamp-rejected' : (${outpass.status == 'PENDING_URGENT'} ? 'stamp-urgent' : 'stamp-pending'))">
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(outpassList)}">
                        <td colspan="3" class="text-muted-inst">No outpass requests yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</body>
</html>
