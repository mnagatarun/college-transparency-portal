<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card shadow-sm" style="width:400px;"><div class="card-body p-4">
        <h4 class="text-center mb-4">Forgot Password</h4>
        <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
        <form th:action="@{/forgot-password}" method="post">
            <input type="email" name="email" class="form-control mb-3" placeholder="Your email" required>
            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
        </form>
        <p class="text-center mt-3"><a th:href="@{/login}">Back to Login</a></p>
    </div></div></div>
</body></html>
